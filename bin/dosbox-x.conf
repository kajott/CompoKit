# minimal DOSBox-X configuration file for CompoKit

[sdl]
fullscreen=true
fullresolution=desktop

[dosbox]
title=CompoKit
quit warning=false

[render]
aspect=true

[cpu]
core=dynamic
cycles=max

[voodoo]
voodoo_card=auto

[mixer]
rate=48000

[midi]
mpu401=uart
mpubase=330
mididevice=win32
# Set "loopMIDI Port" as MIDI output. If loopMIDI and NukedSC55 are running,
# this will play back MIDI via the SC-55. If loopMIDI is not running, DOSBox
# automatically falls back to the first MIDI port, which is MS' Softsnyth.
midiconfig=loopMIDI Port

[sblaster]
oplrate=48000

[gus]
gus=true
gusrate=48000

[speaker]
pcspeaker=true
pcrate=48000
disney=true
